services:
  postgres:
    image: postgres:16-alpine
    container_name: skyreserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skyreserve
      POSTGRES_USER: skyreserve_user
      POSTGRES_PASSWORD: skyreserve_pass
      TZ: Europe/Stockholm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skyreserve-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyreserve_user -d skyreserve"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    container_name: skyreserve-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_db_password
      TZ: Europe/Stockholm
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - skyreserve-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: skyreserve-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --http-enabled=true
      - --http-port=8080
      - --hostname-strict=false
      - --proxy=edge
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_db_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      TZ: Europe/Stockholm
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - skyreserve-network
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skyreserve-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://skyreserve_user:skyreserve_pass@postgres:5432/skyreserve
      DISABLE_AUTH: "false"
      KEYCLOAK_URL: http://localhost:8180
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: skyreserve
      KEYCLOAK_AUDIENCE: skyreserve-api
      INSECURE: "true"
      TZ: Europe/Stockholm
      DUFFEL_API_KEY: ${DUFFEL_API_KEY:-}
    ports:
      - "8000:8000"
    networks:
      - skyreserve-network
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skyreserve-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - skyreserve-network
    depends_on:
      - backend

networks:
  skyreserve-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_db_data:
