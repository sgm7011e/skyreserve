services:
  postgres:
    image: postgres:16-alpine
    container_name: skyreserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skyreserve
      POSTGRES_USER: skyreserve_user
      POSTGRES_PASSWORD: skyreserve_pass
      TZ: Europe/Stockholm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skyreserve-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyreserve_user -d skyreserve"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skyreserve-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://skyreserve_user:skyreserve_pass@postgres:5432/skyreserve
      DISABLE_AUTH: "true"
      KEYCLOAK_REALM: "skyreserve"
      TZ: Europe/Stockholm
      DUFFEL_API_KEY: ${DUFFEL_API_KEY} # in .env, confidential info so shouldnt be here
    ports:
      - "8000:8000"
    networks:
      - skyreserve-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skyreserve-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - skyreserve-network
    depends_on:
      - backend

networks:
  skyreserve-network:
    driver: bridge

volumes:
  postgres_data:
