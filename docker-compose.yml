services:
  postgres:
    image: postgres:15-alpine
    container_name: skyreserve-postgres
    restart: always
    environment:
      POSTGRES_DB: skyreserve
      POSTGRES_USER: skyreserve_user
      POSTGRES_PASSWORD: skyreserve_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyreserve_user -d skyreserve"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skyreserve-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://skyreserve_user:skyreserve_pass@postgres:5432/skyreserve
      DISABLE_AUTH: "true"
      KEYCLOAK_REALM: "skyreserve"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skyreserve-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
